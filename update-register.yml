name: Update sponsor register

on:
  schedule:
    # 每周一 06:30 UTC（英国夏令时 07:30）。Home Office 通常每周更新注册表。
    - cron: '30 6 * * 1'
  workflow_dispatch: {}   # 允许在 GitHub 页面上手动触发（Actions 标签页 → Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest register CSV from GOV.UK
        run: |
          set -euo pipefail
          PAGE_URL="https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers"
          # 从发布页抓最新 CSV 附件链接（形如 https://assets.publishing.service.gov.uk/media/<hash>/SP_-_Worker_..._-_YYYY-MM-DD.csv）
          CSV_URL=$(curl -sL --retry 3 "$PAGE_URL" \
            | grep -oE 'https://assets\.publishing\.service\.gov\.uk/media/[a-f0-9]+/[^"]+\.csv' \
            | head -1)
          if [ -z "$CSV_URL" ]; then
            echo "::error::No CSV link found on publication page — page layout may have changed" >&2
            exit 1
          fi
          echo "Found: $CSV_URL"
          curl -sL --retry 3 "$CSV_URL" -o register.csv

          # 完整性检查：完整注册表约 14 万行。行数骤降说明下载不完整或格式变了，宁可保留旧版。
          LINES=$(wc -l < register.csv)
          echo "Rows: $LINES"
          if [ "$LINES" -lt 100000 ]; then
            echo "::error::Downloaded file only has $LINES rows (expected ~140k) — keeping previous version" >&2
            exit 1
          fi

          basename "$CSV_URL" > SNAPSHOT_NAME.txt
          date -u +%Y-%m-%d > LAST_UPDATED.txt

      - name: Commit if changed
        run: |
          git config user.name "register-bot"
          git config user.email "actions@users.noreply.github.com"
          git add register.csv SNAPSHOT_NAME.txt LAST_UPDATED.txt
          if git diff --cached --quiet; then
            echo "No change since last snapshot."
          else
            git commit -m "Register update $(cat LAST_UPDATED.txt): $(cat SNAPSHOT_NAME.txt)"
            git push
          fi
